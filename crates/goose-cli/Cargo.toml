[package]
name = "goose-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "goose"
path = "src/main.rs"

[dependencies]
goose = { path = "../goose" }
goose-bench = { path = "../goose-bench" }
goose-mcp = { path = "../goose-mcp" }
rmcp = { workspace = true }
sacp = { workspace = true }
agent-client-protocol-schema = "0.10.5"
clap = { workspace = true }
cliclack = "0.3.5"
console = "0.16.1"
uuid = { workspace = true }
dotenvy = { workspace = true }
bat = "0.25.0"
anyhow = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
etcetera = { workspace = true }
rand = "0.8.5"
rustyline = "15.0.0"
tracing = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = { workspace = true }
once_cell = { workspace = true }
shlex = "1.3.0"
async-trait = { workspace = true }
base64 = "0.22.1"
regex = { workspace = true }
nix = { version = "0.30.1", features = ["process", "signal"] }
tar = "0.4"
axum = { workspace = true, features = ["ws", "macros"] }
tower-http = { workspace = true, features = ["fs", "auth"] }
http = { workspace = true }
webbrowser = { workspace = true }
indicatif = "0.18.1"
tokio-util = { workspace = true, features = ["compat", "rt"] }
is-terminal = "0.4.16"
anstream = "0.6.18"
url = { workspace = true }
open = "5.3.2"
urlencoding = { workspace = true }
clap_complete = "4.5.62"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { workspace = true }

[features]
disable-update = []

[dev-dependencies]
tempfile = { workspace = true }
temp-env = { workspace = true, features = ["async_closure"] }
test-case = { workspace = true }
tokio = { workspace = true }
serial_test = { workspace = true }
