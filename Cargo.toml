[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.19.0"
authors = ["Block <ai-oss-tools@block.xyz>"]
license = "Apache-2.0"
repository = "https://github.com/block/goose"
description = "An AI agent"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
axum = "0.8.1"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
ctor = "0.2.9"
dotenvy = "0.15.7"
env-lock = "1.0.1"
etcetera = "0.11.0"
fs2 = "0.4.3"
futures = "0.3"
http = "1.0"
ignore = "0.4.25"
include_dir = "0.7.4"
indoc = "2.0.5"
jsonschema = "0.30.0"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
lazy_static = "1.5.0"
lru = "0.12"
oauth2 = "5.0.0"
once_cell = "1.20.2"
paste = "1.0.0"
regex = "1.11.1"
rmcp = { version = "0.12.0", features = ["schemars", "auth"] }
sacp = "10.0.0"
schemars = { version = "1.0.4", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
serial_test = "3.2.0"
shellexpand = "3.1.1"
temp-env = "0.3.6"
tempfile = "3.15.0"
test-case = "3.3"
thiserror = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7.15"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2.5"
urlencoding = "2.1"
utoipa = { version = "4.1", features = ["chrono"] }
uuid = { version = "1.11", features = ["v4"] }
webbrowser = "1.0"
which = "8.0.0"
winapi = { version = "0.3", features = ["wincred"] }

# Patch for Windows cross-compilation issue with crunchy
[patch.crates-io]
crunchy = { git = "https://github.com/nmathewson/crunchy", branch = "cross-compilation-fix" }
